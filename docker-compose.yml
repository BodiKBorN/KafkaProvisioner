version: '3.9'
services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - '2181:2181'

  kafka:
    image: wurstmeister/kafka
    hostname: kafka
    ports:
      - '9092:9092'
    depends_on:
      - zookeeper
    environment:
      KAFKA_LISTENERS: 'INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INSIDE://kafka:9093,OUTSIDE://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT'
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE

  integration-test:
    image: mcr.microsoft.com/dotnet/sdk:7.0
    volumes:
      - ../src:/app/src
      - ../src/artifacts:/app/artifacts
    entrypoint: [ "dotnet", 'test', '/app/src/Tech.Kafka.IntegrationTests.csproj ', '--logger:"junit;LogFilePath=/app/artifacts/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"' ]
    hostname: integration-test
    environment:
      kafkaHost: kafka:9093
    working_dir: /app/src/Tech.Kafka.IntegrationTests
    depends_on:
      - kafka


